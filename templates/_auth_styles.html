<!-- Shared CSS styles for signin.html, signup.html, and setup.html (Claude-inspired warm UI) -->
<style>
  .auth-page {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    margin: 0;
    padding: 36px 24px 48px;
    background: var(--bg);
    font-family: var(--font-ui);
    color: var(--text);
    box-sizing: border-box;
  }

  /* ── Brand / Heading ─────────────────────────────────────────── */
  .auth-logo {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 0.6rem;
  }
  .auth-logo-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-soft);
    border: 1px solid rgba(217, 119, 87, 0.35);
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .auth-logo-text {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .auth-tagline {
    font-family: var(--font-serif);
    font-size: 18px;
    color: var(--text-2);
    margin: 0 0 1.85rem;
    text-align: center;
  }

  /* ── Card ────────────────────────────────────────────────────── */
  .auth-card {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    width: 100%;
    max-width: 520px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    margin-bottom: 1.5rem;
  }

  /* ── Tabs ────────────────────────────────────────────────────── */
  .auth-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.08);
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 0.9rem;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-3);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .auth-tab:hover {
    color: var(--text);
  }
  .auth-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--bg-elev);
    font-weight: 600;
  }

  /* ── Body ────────────────────────────────────────────────────── */
  .auth-body {
    padding: 1.65rem 1.6rem;
    display: flex;
    flex-direction: column;
    gap: 1.05rem;
  }

  /* ── Google Button ───────────────────────────────────────────── */
  .auth-google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text);
    font-size: 14.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .auth-google-btn:hover {
    background: var(--bg-hover);
    border-color: var(--text-3);
  }

  /* ── Divider ─────────────────────────────────────────────────── */
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--text-3);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .auth-divider::before, .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Form ────────────────────────────────────────────────────── */
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .auth-name-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .auth-field-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    text-align: left;
  }
  .auth-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-2);
    text-transform: uppercase;
  }
  .auth-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .auth-input-icon {
    position: absolute;
    left: 12px;
    color: var(--text-3);
    pointer-events: none;
    flex-shrink: 0;
  }
  .auth-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 0.68rem 2.4rem 0.68rem 2.4rem;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }
  .auth-input-wrap:not(:has(.auth-input-icon)) .auth-input {
    padding-left: 0.85rem;
  }
  .auth-input:focus {
    border-color: var(--accent);
  }
  .auth-input::placeholder {
    color: var(--text-3);
  }
  .auth-eye-btn {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .auth-eye-btn:hover {
    color: var(--text);
  }

  .auth-name-row .auth-field-group:last-child .auth-input {
    padding-left: 0.8rem;
  }

  /* ── Submit Button (Terracotta Orange) ───────────────────────── */
  .auth-submit-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.78rem 1rem;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    margin-top: 0.25rem;
  }
  .auth-submit-btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* ── Link styles ─────────────────────────────────────────────── */
  .auth-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .auth-link:hover {
    text-decoration: underline;
  }
  .auth-switch-text {
    font-size: 13.5px;
    color: var(--text-2);
    text-align: center;
    margin-top: 0.25rem;
  }
  .auth-terms-text {
    font-size: 12.5px;
    color: var(--text-3);
    text-align: center;
    line-height: 1.5;
  }

  /* ── Flash Message ───────────────────────────────────────────── */
  .auth-flash {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 4px;
    background: rgba(229, 115, 115, 0.12);
    border: 1px solid rgba(229, 115, 115, 0.4);
    color: var(--danger);
    text-align: left;
  }

  /* ── Back link ───────────────────────────────────────────────── */
  .auth-back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13.5px;
    color: var(--text-2);
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.15s;
  }
  .auth-back-link:hover {
    color: var(--text);
  }

  /* ── Trust row ───────────────────────────────────────────────── */
  .auth-trust-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.5rem 1rem;
  }
  .auth-trust-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-3);
  }
  .auth-trust-sep {
    color: var(--border-strong);
  }

  /* ── Mobile Responsiveness ───────────────────────────────────── */
  @media (max-width: 520px) {
    .auth-page {
      justify-content: flex-start;
      padding: 1.5rem 0.9rem 2rem !important;
    }
    .auth-logo-text {
      font-size: 24px;
    }
    .auth-tagline {
      font-size: 15px;
      margin-bottom: 1.35rem;
    }
    .auth-card {
      border-radius: 14px !important;
    }
    .auth-body {
      padding: 1.25rem 1.1rem !important;
    }
    .auth-input {
      font-size: 16px !important;
      min-height: 44px;
    }
    .auth-google-btn,
    .auth-submit-btn {
      min-height: 44px;
    }
    .auth-name-row {
      grid-template-columns: 1fr !important;
    }
    .auth-trust-sep {
      display: none !important;
    }
  }
</style>
